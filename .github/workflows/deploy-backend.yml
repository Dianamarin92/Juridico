name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar restart.txt para reiniciar Passenger
        run: echo "${{ github.run_id }}-${{ github.run_number }}" > backend/tmp/restart.txt

      - name: Subir backend a hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: backend/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}
          exclude: |
            **/.git*
            **/.env
            **/.env.local
            **/node_modules/**

